name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BN-ENG Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Permanent Keystore Exists for 1-Click Updates
        run: |
          if [ ! -f "android-app/app/signing.keystore" ]; then
            keytool -genkeypair -v -keystore android-app/app/signing.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass androidpassword -keypass androidpassword -dname "CN=BN-ENG, OU=Assistant, O=App, L=Dhaka, C=BD"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android-app/app/signing.keystore
            git commit -m "chore: persist permanent signing keystore for 1-click updates" || true
            git push origin HEAD:main || true
          fi

      - name: Build Debug APK with Gradle
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Direct Download
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk BN-ENG-Assistant.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BN-ENG-Assistant-APK
          path: BN-ENG-Assistant.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "BN-ENG Assistant Latest APK"
          body: "Direct APK download ready to install on Android without unzipping."
          files: BN-ENG-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
