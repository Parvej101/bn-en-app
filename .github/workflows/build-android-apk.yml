name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build BN-ENG Assistant APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK with Gradle
        working-directory: android-app
        run: gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Install
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk BN-ENG-Assistant.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BN-ENG-Assistant-Debug-APK
          path: BN-ENG-Assistant.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "BN-ENG Assistant Direct APK Download"
          body: "Direct APK file ready to install on Android phone without unzipping."
          files: BN-ENG-Assistant.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
